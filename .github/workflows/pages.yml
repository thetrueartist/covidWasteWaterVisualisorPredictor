name: Build data and deploy site

# Refreshes the data and forecasts every morning (UTC) and publishes the
# static site to GitHub Pages. Enable it once under
# Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Deploy from the repository's default branch only, whatever it's called.
    if: >-
      github.event_name != 'push' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Last good downloads. If a portal is down, the build falls back to these.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: downloads-${{ github.run_id }}
          restore-keys: downloads-
      - run: python -m wastewater -v build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
