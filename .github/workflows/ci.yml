name: CI

on:
  push:
  pull_request:

# Read-only token; no job here needs to write anything.
permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Exact versions with hashes, so a tampered package can't sneak in. The
      # code itself runs from the checkout, so nothing else is installed.
      - run: pip install --require-hashes -r requirements.txt
      - run: pytest -q
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
