[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covid-wastewater"
version = "0.1.0"
description = "COVID-19, flu and RSV wastewater visualiser and forecaster: when is it quiet enough to go out, and when to avoid crowds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wastewater = "wastewater.cli:main"

[tool.setuptools.packages.find]
include = ["wastewater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
